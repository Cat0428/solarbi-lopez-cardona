# Necesidad: Grafana siempre disponible, con su tablero y su fuente de datos cargados al iniciar.
# Deployment porque Grafana es SIN ESTADO en esta solución: todo lo que importa (data source,
# tablero, reglas de alerta) llega por provisioning desde ConfigMaps versionados en Git.
# Si se elimina el pod, el Deployment crea otro idéntico y vuelve con todo, sin clics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: microrred
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: microrred-credenciales, key: GF_SECURITY_ADMIN_USER}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: microrred-credenciales, key: GF_SECURITY_ADMIN_PASSWORD}}
            - name: BI_LECTOR_PASSWORD
              valueFrom: {secretKeyRef: {name: microrred-credenciales, key: BI_LECTOR_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: microrred-credenciales, key: POSTGRES_DB}}
            - {name: PGHOST, value: postgres.microrred.svc.cluster.local:5432}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_USERS_DEFAULT_LANGUAGE, value: es-ES}
            - {name: GF_DATE_FORMATS_DEFAULT_TIMEZONE, value: America/Bogota}
          volumeMounts:
            - {name: ds,        mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: prov-dash, mountPath: /etc/grafana/provisioning/dashboards,  readOnly: true}
            - {name: alertas,   mountPath: /etc/grafana/provisioning/alerting,    readOnly: true}
            - {name: tableros,  mountPath: /var/lib/grafana/dashboards,           readOnly: true}
            - {name: datos,     mountPath: /var/lib/grafana}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
      volumes:
        - {name: ds,        configMap: {name: grafana-datasources}}
        - {name: prov-dash, configMap: {name: grafana-dashboards-provider}}
        - {name: alertas,   configMap: {name: grafana-alertas}}
        - {name: tableros,  configMap: {name: grafana-tableros}}
        - {name: datos,     emptyDir: {}}     # sesiones e historial de alertas: desechables
---
# Acceso desde el navegador del anfitrión: NodePort 30300 → http://127.0.0.1:3001
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: microrred
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http, nodePort: 30300}
