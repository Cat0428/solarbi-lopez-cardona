# PLANTILLA. No contiene contraseñas reales y NO se aplica con kustomize.
# El Secret real lo crean scripts/up.ps1 / up.sh a partir de credenciales.env
# (archivo excluido por .gitignore):
#   kubectl create secret generic microrred-credenciales -n microrred \
#     --from-env-file=credenciales.env --dry-run=client -o yaml | kubectl apply -f -
# Así ninguna contraseña queda en la imagen ni en el repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: microrred-credenciales
  namespace: microrred
type: Opaque
stringData:
  POSTGRES_USER: microrred
  POSTGRES_PASSWORD: cambie-esta-clave
  POSTGRES_DB: microrred
  BI_LECTOR_PASSWORD: cambie-esta-otra-clave
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: cambie-tambien-esta
