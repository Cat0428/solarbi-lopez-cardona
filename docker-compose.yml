# SolarBI Pascual · PostgreSQL + Grafana OSS
#   docker compose up -d        (levanta todo)
#   docker compose down         (apaga; los datos quedan en los volúmenes)
#   docker compose down -v      (apaga y BORRA los datos para empezar de cero)
# Todas las credenciales salen de .env (copiar .env.example → .env).
services:
  postgres:
    image: postgres:16
    container_name: solarbi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BI_LECTOR_PASSWORD: ${BI_LECTOR_PASSWORD}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Se ejecutan solo la primera vez (volumen vacío), en orden alfabético
      - ./sql/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ./sql/02_roles.sh:/docker-entrypoint-initdb.d/02_roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.2.0
    container_name: solarbi-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Bogota
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      POSTGRES_DB: ${POSTGRES_DB}
      BI_LECTOR_PASSWORD: ${BI_LECTOR_PASSWORD}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro

volumes:
  pgdata:
  grafana-data:
